<!doctype html>
<html lang="{{ site.Language.Locale | default site.Language.Lang }}" data-theme-default="{{ site.Params.colorScheme.default }}" data-theme-toggle="{{ site.Params.colorScheme.toggle }}">
  {{ partial "head/head.html" . }}
  <body>
    <a class="skip-link" href="#main-content">{{ i18n "skipContent" }}</a>
    {{ partial "header.html" . }}
    <main id="main-content" tabindex="-1">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer/footer.html" . }}
  </body>
</html>
